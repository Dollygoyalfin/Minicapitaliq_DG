name: Nightly Data Refresh

on:
  schedule:
    # 22:30 UTC = 4:00 AM IST — after US market close, before India opens
    - cron: "30 22 * * *"
  workflow_dispatch: {}   # allows manual "Run workflow" button for testing

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FMP_API_KEY:  ${{ secrets.FMP_API_KEY }}
        run: python ingest.py refresh
